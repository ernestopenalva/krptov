system_wake_window:
  enabled: true
  timezone: "America/Sao_Paulo"
  start: "10:00"
  end: "02:00"

token_scanner_solana:
  enabled: true
  discovery_provider: "dexscreener"
  chain_id: "solana"
  allowed_dex_id: "pumpswap"
  quote_token: "SOL"
  quote_token_address: "So11111111111111111111111111111111111111112"
  require_pump_mint_suffix: true
  cycle_interval_seconds: 60
  request_timeout_seconds: 20
  rate_limit_backoff_seconds: 10
  emitted_retention_hours: 24
  state_file: "data/token_scanner_solana/state.json"
  audit_dir: "data/token_scanner_solana"

  # Jupiter enriquece a observacao, mas nunca aprova ou reprova o token.
  jupiter:
    quote_url: "https://api.jup.ag/swap/v1/quote"
    token_search_url: "https://api.jup.ag/tokens/v2/search"
    api_key_env: "JUPITER_API_KEY"
    buy_amount_lamports: 10000000
    sell_amount_raw: 1000000
    slippage_bps: 100

social_inference:
  enabled: true
  scoring_mode: "origin_reputation"
  disable_post_metric_alerts: true
  require_social_eligibility: "eligible"
  require_numeric_market_score: true
  monitoring_window_hours: 2
  max_posts_per_token: 8
  cycle_interval_seconds: 120
  max_new_tokens_per_day: 0
  max_tokens_per_cycle: 0
  max_new_tokens_per_cycle: 3
  max_active_tokens_per_cycle: 0
  max_social_checks_per_token: 0
  min_social_age_minutes: 0
  min_quote_liquidity_usd: 1
  prioritize_market_score: true

  post_budget:
    enabled: true
    daily_post_budget: 300
    bucket_minutes: 32
    bucket_post_target: 10

  automated_author_usernames:
    - bankrscanner

  automated_author_patterns:
    - scanner
    - signal
    - signals
    - bot

  followers_alert_threshold: 1000

  badges:
    alert_on_affiliation: true
    alert_on_verified_business: true
    alert_on_verified_government: true
    ignore_blue_as_alert: true

  automation:
    enabled: true
    detect_operator: true
    analyze_operator_profile: true
    operator_patterns:
      - "automatizado por @"
      - "automated by @"
      - "bot by @"

  author_followers_thresholds:
    medium: 2000
    high: 20000
    critical: 100000

telegram_alerts:
  enabled: true
  dry_run: false
  parse_mode: "HTML"
  timeout_seconds: 20

ops_alerts:
  enabled: true
  cooldown_seconds: 1800

market_ranker:
  score_weights:
    quote_liquidity: 5
    volume_h24: 3
    txns_h24: 4
    minimum_token_age_inferred: 5

  social_eligibility:
    max_pool_age_minutes: 120

  market_sanity:
    misleading_liquidity_usd_threshold: 100000
    misleading_quote_liquidity_usd_threshold: 1000
    misleading_score_multiplier: 0.25

  watchlist_retention:
    enabled: true
    max_entries: 500
    archive_removed: true
    archive_file: "data/watchlist_archive.jsonl"
    remove_finalized_entries: true
    unranked_retention_hours: 6
    pending_retention_hours: 12
    blocked_old_market_retention_hours: 0
    low_score_retention_hours: 24
    low_score_threshold: 35

  ranking_buffer:
    enabled: true
    file: "data/ranking_buffer.json"
    pending_grace_minutes: 15
    max_rank_attempts: 5

# Cada chain pode alimentar os dois circuitos de forma independente.
chain_routing:
  ethereum:
    inference: true
    monitor: false
    social_alert_to_monitor: false
  base:
    inference: true
    monitor: false
    social_alert_to_monitor: false
  bsc:
    inference: true
    monitor: false
    social_alert_to_monitor: false
  robinhood:
    inference: true
    monitor: false
    social_alert_to_monitor: false
  solana:
    inference: true
    monitor: true
    social_alert_to_monitor: true

# A decisao de existir um alerta continua pertencendo integralmente a
# social_inference. Esta matriz apenas decide o destino do alerta ja aprovado.
social_signal_routing:
  ethereum: &evm_social_actions
    business_badge: {telegram: true, monitor: false}
    government_badge: {telegram: true, monitor: false}
    authors: {telegram: true, monitor: false}
    affiliation: {telegram: true, monitor: false}
  base: *evm_social_actions
  bsc: *evm_social_actions
  robinhood: *evm_social_actions
  solana:
    business_badge: {telegram: true, monitor: true}
    government_badge: {telegram: true, monitor: true}
    authors: {telegram: false, monitor: true}
    affiliation: {telegram: true, monitor: true}

monitor:
  enabled: true
  watchlist_file: "data/monitor_watchlist.json"
  poll_interval_seconds: 5
  max_monitoring_minutes: 15
  max_attempts: 3
  cooldown_minutes: 15

  scheduler:
    max_active_monitors: 5
    max_social_alert_monitors: 2
    loop_interval_seconds: 1

  decision_window_minutes: 5
  momentum_entry:
    enabled: true
    min_ticks_before_decision: 3
    min_momentum_pct: 4.0
    max_runup_pct: 12.0
    max_pullback_from_peak_pct: 3.0
    min_liquidity_growth_pct: 0.0
    max_liquidity_drop_pct: 5.0
    health_min_score: 0.60
    min_buy_pressure: 0.52
    block_if_price_falling: true
    price_falling_window_ticks: 3

  entry:
    min_ticks_before_decision: 12
    min_pullback_pct: 2.0
    max_pullback_pct: 8.0
    max_drawdown_discard_pct: 10.0
    min_buy_pressure: 0.52
    min_volume_keep_ratio: 0.40
    breakout_margin_pct: 0.2
    health_min_score: 0.60
    health_min_volume_ratio: 0.35
    health_min_buy_pressure: 0.48
    health_max_liquidity_drop_pct: 35
    health_recent_ticks: 6
    pullback_recent_ticks: 24

position:
  enabled: true
  mode: "paper"
  poll_interval_seconds: 1
  timeout_seconds: 15
  entry_tick_wait_seconds: 30
  max_entry_divergence_pct: 10
  stop_loss_pct: 5
  breakeven_trigger_pct: 5
  trailing_gap_pct: 4
  stop_persist_seconds: 3
  trailing_persist_seconds: 3
  profit_lock_enabled: true
  profit_lock_steps:
    - trigger_pct: 5
      lock_pct: 1
    - trigger_pct: 6
      lock_pct: 3
    - trigger_pct: 10
      lock_pct: 5
  adaptive_breathing_band:
    enabled: true
    candle_seconds: 3
    lookback_candles: 5
    band_fraction: 0.5
    band_min_pct: 2.0
    band_max_pct: 8.0

market_data:
  rpc_urls:
    ethereum: "ALCHEMY_ETH_HTTPS_URL"
    base: "ALCHEMY_BASE_HTTPS_URL"
    bsc: "ALCHEMY_BNB_HTTPS_URL"
    robinhood: "ALCHEMY_ROBINHOOD_HTTPS_URL"
    solana: "ALCHEMY_SOLANA_RPC_URL"
  uniswap_v4_state_view_addresses:
    ethereum: "UNISWAP_V4_STATE_VIEW_ETHEREUM"
    base: "UNISWAP_V4_STATE_VIEW_BASE"
    bsc: "UNISWAP_V4_STATE_VIEW_BSC"
    robinhood: "UNISWAP_V4_STATE_VIEW_ROBINHOOD"
  quote_usd_cache_seconds: 60
  quote_usd_max_staleness_seconds: 120
